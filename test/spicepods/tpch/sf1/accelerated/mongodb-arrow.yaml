version: v1
kind: Spicepod
name: mongodb-arrow

# Define common anchors
definitions:
  # Common mongodb parameters
  - &mongodb_params
    # mongodb_connection_string: mongodb://root:root@34.132.129.192:1234/tpch?authSource=admin&tls=false
    mongodb_connection_string: mongodb://root:root@localhost:27017/tpch?authSource=admin&tls=false
    # mongodb_host: 34.132.129.192
    # mongodb_tcp_port: 1234
    # mongodb_db: tpch
    # mongodb_user: root
    # mongodb_pass: root
    # mongodb_sslmode: disabled
  - &acceleration
    enabled: true
    engine: arrow

datasets:
  - from: mongodb:customer
    name: customer
    params: *mongodb_params
    acceleration: *acceleration

  - from: mongodb:lineitem
    name: lineitem
    params: *mongodb_params
    acceleration: *acceleration

  - from: mongodb:nation
    name: nation
    params: *mongodb_params
    acceleration: *acceleration

  - from: mongodb:orders
    name: orders
    params: *mongodb_params
    acceleration: *acceleration

  - from: mongodb:part
    name: part
    params: *mongodb_params
    acceleration: *acceleration

  - from: mongodb:partsupp
    name: partsupp
    params: *mongodb_params
    acceleration: *acceleration

  - from: mongodb:region
    name: region
    params: *mongodb_params
    acceleration: *acceleration

  - from: mongodb:supplier
    name: supplier
    params: *mongodb_params
    acceleration: *acceleration
